[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equityiq-backend"
version = "0.1.0"
description = "EquityIQ Backend Service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "celery>=5.4.0",
    "redis>=5.0.4",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "llama-index-core>=0.10.0",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=2.7.0",
    "openai>=1.30.0",
    "google-generativeai>=0.5.4",
    "transformers>=4.41.0",
    "torch>=2.3.0",
    "yfinance>=0.2.40",
    "sec-edgar-downloader>=5.0.0",
    "FinanceDatabase>=0.3.0",
    "QuantLib>=1.34",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "bcrypt>=4.1.0",
    "pdfplumber>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "import-linter>=2.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=3.7.0",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "RUF"]
ignore = ["E501", "N818", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
